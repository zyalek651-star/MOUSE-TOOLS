name: Build Mouse Tools APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

            - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        run: |
          mkdir -p extracted
          ZIP=$(find . -name 'TCOR_PROJECT_UPLOAD.zip' -print -quit)
          if [ -z "$ZIP" ]; then
            echo "ZIP proyek tidak ditemukan"
            exit 1
          fi
          unzip -o "$ZIP" -d extracted

      - name: Locate Android project
        run: |
          FILE=$(find extracted -name settings.gradle -type f -print -quit)
          if [ -z "$FILE" ]; then
            echo "settings.gradle tidak ditemukan"
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Proyek ditemukan di: $DIR"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Gradle Wrapper
        run: |
          cd "$PROJECT_DIR"
          gradle wrapper --gradle-version 8.7

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mouse-Tools-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
